<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حاسبة القهوة | الإصدار العربي الفاخر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@700;900&display=swap');

        :root {
            --bg-color: #000000;
            --surface-color: #0a0a0a;
            --border-color: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #555555;
            --accent-glow: rgba(255, 255, 255, 0.05);
            --danger: #b22222;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #111 0%, #000 80%);
            color: var(--text-primary);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 400px; padding: 20px; position: relative; }

        /* زر الإعدادات */
        .settings-btn {
            position: absolute; top: 20px; left: 20px; background: var(--surface-color); 
            border: 1px solid var(--border-color); color: var(--text-secondary); 
            padding: 8px 12px; border-radius: 12px; font-size: 11px; cursor: pointer;
            transition: 0.3s; z-index: 10;
        }

        .logo-box { text-align: center; margin-bottom: 5px; }
        .coffee-logo { width: 60px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.1)); }

        /* عداد الصكات */
        .sakat-header {
            display: flex; justify-content: center; gap: 60px; margin-bottom: 20px;
        }
        .sakat-box { text-align: center; }
        .sakat-label { font-size: 10px; color: var(--text-secondary); font-weight: bold; }
        .sakat-num { font-family: 'Orbitron', sans-serif; font-size: 30px; color: var(--text-primary); font-weight: 900; }

        /* لوحة النقاط */
        .board {
            background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 40px;
            padding: 25px 10px; display: flex; justify-content: space-around;
            align-items: center; margin-bottom: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        .side { flex: 1; text-align: center; }
        .team-name {
            background: transparent; border: none; color: var(--text-secondary); text-align: center;
            font-size: 18px; font-weight: 900; width: 100%; outline: none; font-family: 'Cairo';
            margin-bottom: 5px;
        }
        .team-name:focus { color: var(--text-primary); }
        .score-val { font-family: 'Orbitron', sans-serif; font-size: 60px; font-weight: 900; color: var(--text-primary); line-height: 1; }
        .divider { width: 1px; height: 80px; background: #1a1a1a; }

        /* منطقة الإدخال */
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card-in { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 25px; padding: 18px; text-align: center; }
        .card-in label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
        input[type="number"] {
            background: transparent; border: none; color: #fff; font-family: 'Orbitron';
            font-size: 32px; width: 100%; text-align: center; outline: none; user-select: text;
        }

        /* الأزرار */
        .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 30px; }
        .btn-add { background: var(--text-primary); color: #000; border: none; border-radius: 22px; padding: 22px; font-weight: 900; font-size: 18px; cursor: pointer; }
        .btn-undo { background: var(--surface-color); color: var(--danger); border: 1px solid var(--border-color); border-radius: 22px; font-weight: 700; cursor: pointer; }
        .btn-add:active, .btn-undo:active { transform: scale(0.96); opacity: 0.8; }

        /* السجل */
        .history { background: var(--accent-glow); border-radius: 30px; padding: 20px; max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); }
        .history-row {
            display: flex; justify-content: space-between; padding: 14px 18px; background: var(--surface-color);
            border: 1px solid var(--border-color); border-radius: 18px; margin-bottom: 10px; font-family: 'Orbitron'; font-size: 14px;
        }
        .history-row.win-row { border-color: #333; background: #111; }

        /* الإعدادات */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--surface-color); padding: 40px 20px; border-radius: 40px; text-align: center; width: 85%; border: 1px solid var(--border-color); }
        .opt-btn { background: #111; color: #555; border: 1px solid #222; padding: 18px; margin: 8px 0; width: 100%; border-radius: 20px; font-size: 18px; font-weight: 900; transition: 0.3s; }
        .opt-btn.active { background: #fff; color: #000; border-color: #fff; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>

    <div class="container">
        <button class="settings-btn" onclick="toggleModal()">⚙️ الإعدادات</button>
        
        <div class="logo-box">
            <img src="https://cdn.discordapp.com/attachments/1220885943628857345/1503960294001606696/image-removebg-preview_1.png?ex=6a053fac&is=6a03ee2c&hm=a509c7484f2084e85318aeefb1a3fddee70d195d6de0495573f36657319efe13&" class="coffee-logo">
        </div>

        <div class="sakat-header">
            <div class="sakat-box">
                <span class="sakat-label">صكات لنا</span>
                <div class="sakat-num" id="sakat1">0</div>
            </div>
            <div class="sakat-box">
                <span class="sakat-label">صكات لهم</span>
                <div class="sakat-num" id="sakat2">0</div>
            </div>
        </div>

        <div class="board">
            <div class="side">
                <input type="text" class="team-name" id="n1" value="لـنـا" spellcheck="false">
                <div class="score-val" id="total1">0</div>
            </div>
            <div class="divider"></div>
            <div class="side">
                <input type="text" class="team-name" id="n2" value="لـهـم" spellcheck="false">
                <div class="score-val" id="total2">0</div>
            </div>
        </div>

        <div class="input-row">
            <div class="card-in">
                <label>لنا</label>
                <input type="number" id="in1" placeholder="0" inputmode="numeric">
            </div>
            <div class="card-in">
                <label>لهم</label>
                <input type="number" id="in2" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-add" onclick="addRound()">تسجيل الجولة</button>
            <button class="btn-undo" onclick="undo()">تراجع</button>
        </div>

        <div class="history" id="logs"></div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 25px; font-weight: 900;">نظام الصكات</h3>
            <button class="opt-btn" onclick="setTarget(1)" id="t1">1 صكة (فوز مباشر)</button>
            <button class="opt-btn" onclick="setTarget(3)" id="t3">3 صكات (الأفضل من 3)</button>
            <button class="opt-btn" onclick="setTarget(5)" id="t5">5 صكات (الأفضل من 5)</button>
            <button class="opt-btn" style="background:transparent; border:none; color:#333; margin-top:20px" onclick="toggleModal()">رجوع</button>
        </div>
    </div>

    <script>
        let logs = [], s1 = 0, s2 = 0, sakat1 = 0, sakat2 = 0, targetSakat = 3;

        function setTarget(num) {
            targetSakat = num;
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('t' + num).classList.add('active');
            toggleModal();
            resetAll();
        }

        function toggleModal() {
            let m = document.getElementById('settingsModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }

        function addRound() {
            let v1 = parseInt(document.getElementById('in1').value) || 0;
            let v2 = parseInt(document.getElementById('in2').value) || 0;
            if (v1 === 0 && v2 === 0) return;

            let isReset = false;
            let oldS1 = s1, oldS2 = s2;
            s1 += v1; s2 += v2;

            if (s1 >= 152) {
                sakat1++; isReset = true;
                if (sakat1 >= targetSakat) { alert("تمت الصكات! مبروك لنا الفوز بالمباراة"); resetAll(); return; }
            } else if (s2 >= 152) {
                sakat2++; isReset = true;
                if (sakat2 >= targetSakat) { alert("تمت الصكات! مبروك لهم الفوز بالمباراة"); resetAll(); return; }
            }

            logs.push({ v1, v2, isReset, oldS1, oldS2 });
            if (isReset) { s1 = 0; s2 = 0; }
            render();
            document.getElementById('in1').value = ''; document.getElementById('in2').value = '';
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function undo() {
            if (!logs.length) return;
            let last = logs.pop();
            if (last.isReset) {
                if (sakat1 > 0 && last.v1 + last.oldS1 >= 152) sakat1--;
                if (sakat2 > 0 && last.v2 + last.oldS2 >= 152) sakat2--;
                s1 = last.oldS1 + last.v1; s2 = last.oldS2 + last.v2;
                s1 -= last.v1; s2 -= last.v2; 
            } else {
                s1 -= last.v1; s2 -= last.v2;
            }
            render();
            if (navigator.vibrate) navigator.vibrate([30, 30]);
        }

        function resetAll() {
            logs = []; s1 = 0; s2 = 0; sakat1 = 0; sakat2 = 0; render();
        }

        function render() {
            document.getElementById('total1').innerText = s1;
            document.getElementById('total2').innerText = s2;
            document.getElementById('sakat1').innerText = sakat1;
            document.getElementById('sakat2').innerText = sakat2;
            const logBox = document.getElementById('logs');
            logBox.innerHTML = '';
            [...logs].reverse().forEach((l, i) => {
                let div = document.createElement('div');
                div.className = 'history-row' + (l.isReset ? ' win-row' : '');
                div.innerHTML = `<span>الجولة ${logs.length - i}</span><span>${l.v1} : ${l.v2}</span>`;
                logBox.appendChild(div);
            });
        }
        document.getElementById('t3').classList.add('active');
    </script>
</body>
</html>
